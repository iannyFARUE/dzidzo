{% extends "layout.html" %} {% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-24 text-center">
  <p class="font-serif text-7xl font-bold text-gray-900">{{ status_code }}</p>
  <h1 class="mt-4 text-2xl font-semibold text-gray-900">
    {% if status_code == 404 %}Page not found{% else %}Something went wrong{% endif %}
  </h1>
  <p class="mt-3 text-gray-500">
    {{ detail or "The page you're looking for doesn't exist or has been moved." }}
  </p>
  <a
    href="/"
    class="mt-8 inline-block text-sm font-semibold text-white bg-gray-900 hover:bg-gray-800 rounded-full px-6 py-2.5"
  >
    Back to home
  </a>
</div>
{% endblock content %}
