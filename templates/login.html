{% extends "layout.html" %} {% block content %}
<div class="max-w-sm mx-auto px-4 sm:px-6 py-16">
  <h1 class="font-serif text-3xl font-bold text-gray-900 text-center">Welcome back.</h1>
  <p class="mt-2 text-sm text-gray-500 text-center">Sign in to write and manage your stories.</p>

  {% if error %}
  <div class="mt-8 rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{ error }}
  </div>
  {% endif %}

  <form method="post" action="/login" class="mt-8 space-y-5">
    <input type="hidden" name="next" value="{{ next }}" />

    <div>
      <label for="username" class="block text-xs font-medium text-gray-500 mb-1">Username or email</label>
      <input
        type="text"
        id="username"
        name="username"
        value="{{ username or '' }}"
        autocomplete="username"
        required
        autofocus
        class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
      />
    </div>

    <div>
      <label for="password" class="block text-xs font-medium text-gray-500 mb-1">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
        class="w-full rounded border border-gray-300 px-3 py-2 text-sm focus:border-gray-900 focus:outline-none"
      />
    </div>

    <button
      type="submit"
      class="w-full bg-gray-900 hover:bg-gray-800 text-white text-sm font-semibold rounded-full px-5 py-2.5"
    >
      Sign in
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-gray-500">
    No account?
    <a href="/register?next={{ next | urlencode }}" class="font-medium text-gray-900 underline">Create one</a>
  </p>
</div>
{% endblock content %}
